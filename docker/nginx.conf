user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    # nginx's mime.types has no entry for .webmanifest, so it fell through to
    # default_type and the manifest was served as application/octet-stream.
    # Chrome will not install a site to a home screen from a manifest served
    # under the wrong type, and nothing in the page fails visibly when it does.
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;

        # Hashed filenames, so these can be cached hard. Photographs are served
        # through the storage symlink and change only on a redeploy.
        location ~* \.(?:css|js|woff2?|jpg|jpeg|png|webp|avif|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Nothing outside public/ is reachable, and dotfiles are never served.
        location ~ /\. { deny all; }
    }
}
